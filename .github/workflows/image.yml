name: Image

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  hub-image:
    name: Build, scan and publish hub image
    runs-on: ubuntu-latest
    # Single job: fail-fast is implicit — a failing build or scan fails the workflow.
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hub
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      # ponytail: PR rebuilds a single-arch image and loads it locally so the scan has a real ref;
      # multi-arch + push only happen on push events (buildx cannot load a manifest list).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}

      # ponytail: grype's `only-fixed: true` is the equivalent of trivy's `ignore-unfixed: true`.
      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          output-format: table
          severity-cutoff: high
          fail-build: true
          only-fixed: true
