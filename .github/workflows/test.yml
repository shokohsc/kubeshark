on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Test

jobs:
  run-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: make test

      - name: Hub coverage gate
        run: make hub-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
